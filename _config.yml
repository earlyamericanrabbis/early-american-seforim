# ------------------------------------------------------------
#  Early American Seforim — site settings
#  You rarely need to touch this file.
#  IMPORTANT: "baseurl" must match the name of your GitHub repository.
#  If your repository is github.com/yourname/early-american-seforim
#  then baseurl is "/early-american-seforim".
# ------------------------------------------------------------

title: Early American Rabbis
tagline: The lives and seforim of America's early rabbis
description: >-
  The rabbis who built Torah life in America: their lives, their communities,
  and their seforim, restored and re-published in print and online.
logo:                     # e.g. /assets/images/logo.png (leave blank for no logo)
baseurl: "/early-american-seforim"
url: ""

# Social media (shown in the header, footer and sign-up bar)
substack: https://earlyamericanrabbis.substack.com
social:
  - name: Substack
    icon: substack
    url: https://earlyamericanrabbis.substack.com
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/earlyamericanrabbis
  - name: X
    icon: x
    url: https://x.com/EarlyUSRabbis
  - name: Facebook
    icon: facebook
    url: https://www.facebook.com/share/19thnakYtH/
  - name: WhatsApp group
    icon: whatsapp
    url: https://chat.whatsapp.com/J9a9XyoUcAzEDhr5dFN88J

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  rabbis:
    output: true
    permalink: /rabbis/:name/
  books:
    output: true
    permalink: /books/:name/
  derashos:
    output: true
    permalink: /derashos/:path/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: rabbis }
    values: { layout: rabbi }
  - scope: { path: "", type: books }
    values: { layout: book }
  - scope: { path: "", type: derashos }
    values: { layout: derasha }

exclude:
  - README.md
  - HOW-TO-ADD-CONTENT.md
  - templates
  - Gemfile
  - Gemfile.lock
  - vendor
