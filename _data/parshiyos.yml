# The 54 parshiyos, in order. A derasha's "parsha:" must match a "name" here exactly.
- chumash: Bereishis
  hebrew: בראשית
  english: Genesis
  parshiyos:
    - { name: "Bereishis", hebrew: "בראשית" }
    - { name: "Noach", hebrew: "נח" }
    - { name: "Lech Lecha", hebrew: "לך לך" }
    - { name: "Vayeira", hebrew: "וירא" }
    - { name: "Chayei Sarah", hebrew: "חיי שרה" }
    - { name: "Toldos", hebrew: "תולדות" }
    - { name: "Vayeitzei", hebrew: "ויצא" }
    - { name: "Vayishlach", hebrew: "וישלח" }
    - { name: "Vayeishev", hebrew: "וישב" }
    - { name: "Mikeitz", hebrew: "מקץ" }
    - { name: "Vayigash", hebrew: "ויגש" }
    - { name: "Vayechi", hebrew: "ויחי" }
- chumash: Shemos
