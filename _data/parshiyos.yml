    - { name: "Mishpatim", hebrew: "משפטים" }
    - { name: "Terumah", hebrew: "תרומה" }
    - { name: "Tetzaveh", hebrew: "תצוה" }
    - { name: "Ki Sisa", hebrew: "כי תשא" }
    - { name: "Vayakhel", hebrew: "ויקהל" }
    - { name: "Pekudei", hebrew: "פקודי" }
