<section class="signup" aria-labelledby="signup-title">
  <div class="wrap signup-inner">
    <div class="signup-text">
      <h2 id="signup-title">Early American Parsha, every week</h2>
      <p>Each week's parsha through the words of an early American Rav, free in your inbox from our Substack.</p>
    </div>
    <form class="signup-form" action="{{ site.substack }}/subscribe" method="get" target="_blank">
      <label class="sr-only" for="signup-email">Email address</label>
      <input id="signup-email" type="email" name="email" placeholder="Your email address" required>
      <button type="submit" class="btn">Subscribe</button>
    </form>
  </div>
</section>
