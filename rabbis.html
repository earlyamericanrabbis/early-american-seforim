---
title: Rabbis
permalink: /rabbis/
---
<div id="rabbi-directory">
  <h1>The Rabbis</h1>
  <p class="lede">Search by name in English or Hebrew, by city, or click a state on the map.</p>

  <div class="dir-map">{% include us-map.svg %}</div>

  <div class="dir-controls">
    <input id="rq" class="filter" type="search" placeholder="Name, Hebrew name, city or yahrzeit…">
    <select id="rstate" class="filter"><option value="">All states</option></select>
    <button id="rclear" type="button" class="btn btn-outline">Clear</button>
  </div>
  <div id="rletters" class="letters"></div>
  <p id="rstatus" class="meta dir-status"></p>
  <div id="rresults" class="rabbi-grid"></div>

  <noscript>
    <ul>{% assign rs = site.rabbis | sort: "sort_name" %}{% for r in rs %}<li><a href="{{ r.url | relative_url }}">{{ r.name }}</a></li>{% endfor %}</ul>
  </noscript>
</div>
